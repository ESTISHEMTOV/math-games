<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>שבילים 9 🛤️</title>
  <script>document.write('<link rel="stylesheet" href="style.css?t=' + Date.now() + '">');</script>
  <style>
    /* תוספות עיצוב לעמוד שבילים 9 בלבד */
    .expr { direction: ltr; unicode-bidi: isolate; font-weight: 900;
            font-size: clamp(26px, 6vw, 42px); letter-spacing: 1px; }
    /* בתוך כפתור תשובה: התרגיל תמיד בשורה אחת, בגודל שמתאים לרוחב הכפתור */
    .opt .expr { font-size: clamp(18px, 3.6vw, 24px); letter-spacing: 0;
                 white-space: nowrap; display: inline-block; }
    .cmp  { display: inline-flex; align-items: center; justify-content: center; gap: 18px;
            margin-top: 12px; font-size: clamp(30px, 7vw, 46px); font-weight: 900; }
    .blank{ display: inline-block; min-width: 46px; height: 42px; border: 3px dashed #9b5de5;
            border-radius: 12px; vertical-align: middle; background: rgba(255,255,255,.6); }
    .frac { display: inline-flex; flex-direction: column; align-items: center;
            vertical-align: middle; line-height: 1; margin: 0 3px; font-weight: 900; }
    .frac .num { border-bottom: 3px solid currentColor; padding: 0 8px 2px; }
    .frac .den { padding: 2px 8px 0; }
    .word-q { font-size: clamp(18px, 3.6vw, 24px); font-weight: 700; line-height: 1.5;
              background: #f4f0ff; border-radius: 18px; padding: 16px 20px;
              max-width: 620px; unicode-bidi: plaintext; }
    /* איור אמוג'י גדול מעל השאלה */
    .illus { font-size: clamp(46px, 12vw, 82px); line-height: 1; margin: 2px 0 8px;
             filter: drop-shadow(0 4px 6px rgba(43,33,64,.18)); }
    /* כרטיס שאלה צבעוני עם דמות מצוירת (כמו הכרטיסים בחוברת) */
    .qcard { position: relative; width: 100%; max-width: 700px; border-radius: 30px;
             padding: 30px 22px 24px; margin-top: 10px; box-shadow: var(--shadow);
             display: flex; flex-direction: column; align-items: center; gap: 14px;
             border: 3px solid rgba(255,255,255,.7); animation: pop .3s ease; }
    .qcard .word-q { background: rgba(255,255,255,.72); }
    .mascot { position: absolute; top: -24px; inset-inline-start: 16px; font-size: 50px;
              filter: drop-shadow(0 3px 4px rgba(0,0,0,.22)); transform: rotate(-8deg); }
    .b-blue   { background: linear-gradient(160deg, #eaf4ff, #d3e8ff); }
    .b-pink   { background: linear-gradient(160deg, #ffe9f2, #ffd3e4); }
    .b-yellow { background: linear-gradient(160deg, #fff7d6, #ffedaa); }
    .b-green  { background: linear-gradient(160deg, #e6fbee, #cbf5d9); }
    .b-purple { background: linear-gradient(160deg, #f3ecff, #e4d3ff); }
    .b-peach  { background: linear-gradient(160deg, #ffefe0, #ffdabf); }

    /* ---- מצב קומפקטי: שכל התשובות ייראו במסך אחד, ממורכז ---- */
    .wrap { padding-top: 12px; padding-bottom: 22px; }
    .stage { min-height: 0; padding: 14px 14px 20px; margin-top: 8px; gap: 10px; }
    .qcard { padding: 20px 16px 14px; margin-top: 6px; gap: 8px; }
    .prompt-he { font-size: clamp(16px, 3.3vw, 22px); }
    .word-q { font-size: clamp(15px, 3vw, 19px); padding: 10px 14px; line-height: 1.45; }
    .illus  { font-size: clamp(34px, 8vw, 52px); margin: 0 0 4px; }
    .mascot { font-size: 38px; top: -18px; }
    .expr   { font-size: clamp(22px, 5vw, 32px); }
    .cmp    { font-size: clamp(24px, 5.5vw, 34px); margin-top: 6px; }
    .blank  { min-width: 38px; height: 34px; }
    .shape-svg { max-height: 180px !important; padding: 6px; }
    .opts { gap: 10px; max-width: 680px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
    .opt  { padding: 12px 12px; font-size: clamp(16px, 3.2vw, 21px); border-width: 3px; }
    .opt .expr { font-size: clamp(15px, 3.2vw, 20px); }
    .actions { margin-top: 2px; }
    .action { padding: 11px 20px; font-size: 18px; }
    /* ריווח נעים בהסבר */
    .explain { line-height: 1.9; padding: 14px 20px; max-width: 600px; }
    .explain span[dir="ltr"] { margin: 0 5px; }
    /* תרגיל הקלדה — פילוג בכפל */
    .calc { direction: ltr; display: flex; flex-direction: column; gap: 12px;
            align-items: center; font-weight: 800; font-size: clamp(17px, 3.6vw, 24px); margin-top: 6px; }
    .calc-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; justify-content: center; }
    .num-in { width: 62px; height: 42px; text-align: center; font-size: 21px; font-weight: 800;
              border: 3px solid #c9b8ee; border-radius: 11px; font-family: inherit; background: #fff; color: var(--ink); }
    .num-in:focus { outline: none; border-color: var(--purple); }
    .num-in.in-ok  { border-color: var(--green); background: #dcfce7; }
    .num-in.in-bad { border-color: var(--pink);  background: #fee2e2; }
    /* כפל מאונך — רשת עמודות עם תא לכל ספרה + תאי נשׂא למעלה */
    .vgrid { direction: ltr; display: grid; gap: 6px; justify-content: center; align-items: center;
             margin-top: 8px; background: rgba(255,255,255,.72); padding: 14px 18px; border-radius: 16px; }
    .vg-dig { font-size: clamp(24px, 6vw, 34px); font-weight: 900; text-align: center; }
    .vg-op  { font-size: clamp(24px, 6vw, 34px); font-weight: 900; text-align: left; }
    .vg-bar2 { border-top: 4px solid #2b2140; height: 0; margin: 2px 0; }
    .carry-in { width: 30px; height: 26px; text-align: center; font-size: 14px; font-weight: 800;
                border: 2px dashed #b79be0; border-radius: 7px; background: rgba(255,255,255,.55); color: var(--purple); }
    .carry-in:focus { outline: none; border-color: var(--purple); }
    .vg-in { width: 46px !important; height: 46px; padding: 0; font-size: 24px; }
    /* כפל בדרך מפורטת */
    .det-head { font-size: clamp(24px, 6vw, 32px); font-weight: 900; direction: ltr; margin-top: 6px; }
    .det-list { display: flex; flex-direction: column; gap: 11px; align-items: center; margin-top: 8px; direction: ltr; }
    .det-row  { display: flex; align-items: center; gap: 10px; font-size: clamp(17px, 3.8vw, 23px); font-weight: 800; }
    .det-lbl  { min-width: 96px; text-align: right; }
    .det-bar  { border-top: 3px solid #2b2140; width: 190px; margin: 1px 0; }
    .vg-lbl   { display: flex; align-items: center; gap: 6px; font-size: 18px; font-weight: 800;
                padding-inline-start: 10px; direction: ltr; white-space: nowrap; color: var(--ink-soft); }
    .op-in    { text-align: center; }
    /* טבלת ערכי האותיות (גימטריה) */
    .gem-table-btn { margin-top: 6px; border: none; cursor: pointer; font-family: inherit; font-size: 15px;
                     font-weight: 800; color: var(--purple); background: #f0e6ff; border-radius: 999px; padding: 8px 16px; }
    .gem-table-btn:hover { filter: brightness(1.04); }
    .gt-card { background: linear-gradient(160deg, #fff, #f3ecff); border-radius: 28px; padding: 22px 20px;
               max-width: 520px; width: 92%; box-shadow: var(--shadow-lg); text-align: center; max-height: 88vh; overflow: auto; }
    .gt-card h2 { color: var(--purple); margin: 2px 0 14px; font-size: 24px; }
    .gt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(58px, 1fr)); gap: 7px; direction: rtl; margin-bottom: 14px; }
    .gt-cell { background: #faf7ff; border: 2px solid #e4d3ff; border-radius: 12px; padding: 7px 4px;
               display: flex; flex-direction: column; align-items: center; }
    .gt-let { font-size: 24px; font-weight: 900; color: var(--ink); }
    .gt-val { font-size: 14px; font-weight: 800; color: var(--purple); }
    /* רשימת שאלות הקלדה (שלמים וחלקים) */
    .wq-list { display: flex; flex-direction: column; gap: 13px; width: 100%; max-width: 620px; margin-top: 4px; }
    .wq-row  { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; justify-content: center;
               font-size: clamp(15px, 3.3vw, 20px); font-weight: 700; unicode-bidi: plaintext; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <button class="btn-back" id="back">⬅️ חזרה</button>
      <div class="score" id="score">⭐ 0</div>
    </div>

    <!-- תפריט סוגי התרגילים -->
    <div id="menu">
      <h1 class="page-title">שבילים 9 🛤️</h1>
      <p class="subtitle">בחרי תרגול 👇</p>
      <div class="games-grid">
        <button class="game-card c-blue"   onclick="play('chain')"><span class="ico">🔗</span><span class="ttl">סדר פעולות</span><span class="sub">תרגילי שרשרת · סוגריים</span></button>
        <button class="game-card c-purple" onclick="play('word')"><span class="ico">📝</span><span class="ttl">בעיה ותרגיל</span><span class="sub">איזה תרגיל שרשרת מתאים</span></button>
        <button class="game-card c-pink"   onclick="play('whichFrac')"><span class="ico">🍰</span><span class="ttl">כמה על החלק?</span><span class="sub">חלק מכמות עם ציור</span></button>
        <button class="game-card c-teal"   onclick="play('partQty')"><span class="ico">🍬</span><span class="ttl">חלק מכמות</span><span class="sub">סכום שני שברים מכמות</span></button>
        <button class="game-card c-peach"  onclick="play('cmpFrac')"><span class="ico">⚖️</span><span class="ttl">השוואת שברים</span><span class="sub">מה גדול יותר — חישוב</span></button>
        <button class="game-card c-green"  onclick="play('divis')"><span class="ico">➗</span><span class="ttl">סימני התחלקות</span><span class="sub">מתחלק בשתי קבוצות בו-זמנית</span></button>
        <button class="game-card c-blue"   onclick="play('gem')"><span class="ico">אבג</span><span class="ttl">ערך מספרי של אותיות</span><span class="sub">גימטריה</span></button>
        <button class="game-card c-purple" onclick="play('neg')"><span class="ico">🌡️</span><span class="ttl">מספרים שליליים</span><span class="sub">סדר · טמפרטורות · הפרש · גובה</span></button>
        <button class="game-card c-teal"   onclick="play('beforeAfter')"><span class="ico">🧭</span><span class="ttl">מספרים עד 10,000</span><span class="sub">מאות שלמות · השוואת מספרים קרובים</span></button>
        <button class="game-card c-peach"  onclick="play('chart')"><span class="ico">📊</span><span class="ttl">חקר נתונים</span><span class="sub">חישוב מתוך דיאגרמה</span></button>
        <button class="game-card c-green"  onclick="play('riddle')"><span class="ico">🔍</span><span class="ttl">מי אני?</span><span class="sub">חידת מספר לפי כמה רמזים</span></button>
        <button class="game-card c-blue"   onclick="play('pattern')"><span class="ico">➡️</span><span class="ttl">חוקיות בסדרה</span><span class="sub">ריבועים · איבר רחוק</span></button>
        <button class="game-card c-purple" onclick="play('place')"><span class="ico">🔢</span><span class="ttl">ערך הספרה</span><span class="sub">הרכבת מספר וערך ספרה</span></button>
        <button class="game-card c-pink"   onclick="play('wholes')"><span class="ico">🍰</span><span class="ttl">שלמים וחלקים</span><span class="sub">אופים, אוכלים — כמה נשאר</span></button>
        <button class="game-card c-blue"   onclick="play('compareExpr')"><span class="ico">🟰</span><span class="ttl">שווה או לא?</span><span class="sub">השוואת תרגילים (חוקי פעולות)</span></button>
        <button class="game-card c-green"  onclick="play('vmult')"><span class="ico">🧮</span><span class="ttl">כפל ארוך — מאונך</span><span class="sub">שיטת דניאלה · מקלידים</span></button>
        <button class="game-card c-yellow" onclick="play('vdetail')"><span class="ico">📝</span><span class="ttl">כפל ארוך — מפורט</span><span class="sub">מכפלות חלקיות · מקלידים</span></button>
        <button class="game-card c-pink"   onclick="play('wholesType')"><span class="ico">🍰</span><span class="ttl">חלקים ושלמים</span><span class="sub">מקלידים — כמה חלקים בשלמים</span></button>
        <button class="game-card c-green"  onclick="play('complete')"><span class="ico">🧩</span><span class="ttl">השלמה לתוצאה</span><span class="sub">מצא את המספר החסר בתרגיל</span></button>
        <button class="game-card c-peach"  onclick="play('groups')"><span class="ico">🚀</span><span class="ttl">קבוצות שוות</span><span class="sub">אתגר · מספר תלמידים כולל</span></button>
        <button class="game-card c-teal"   onclick="play('boysGirls')"><span class="ico">🚀</span><span class="ttl">בנים ובנות</span><span class="sub">אתגר · סכום והפרש</span></button>
        <button class="game-card c-purple" onclick="play('clueNumber')"><span class="ico">🚀</span><span class="ttl">מספר לפי רמזים</span><span class="sub">אתגר · מספר בן 4 ספרות</span></button>
        <button class="game-card c-mix"    onclick="play('mixed')"><span class="ico">🎲</span><span class="ttl">תרגול מעורב</span><span class="sub">הכל ביחד</span></button>
        <button class="game-card c-yellow" onclick="play('progress')"><span class="ico">🏆</span><span class="ttl">ההתקדמות שלי</span><span class="sub">שלבים ואליפויות</span></button>
      </div>
    </div>

    <!-- מסך תרגיל -->
    <div id="stageWrap" class="hidden"><div class="stage" id="stage"></div></div>
  </div>

  <script>document.write('<script src="engine.js?t=' + Date.now() + '"><\/script>');</script>
  <script>
    const PLAYER = "girl";
    const menu = document.getElementById("menu");
    const stageWrap = document.getElementById("stageWrap");
    const stage = document.getElementById("stage");
    Score.init(document.getElementById("score"), PLAYER);
    speakHe = () => Promise.resolve();   // ללא שמיעה/הקראה בעמוד זה

    /* ---- מעקב לפי סוג פרק ולפי יום (אחוזים + נכון/סה"כ) ----
       נשמר במכשיר, ומסונכרן ל-Supabase אם CONF מוגדר (יתמלא כשיהיו הפרטים). */
    const CONF = { url: "https://rgqiyqsabylcylsmdnsi.supabase.co", key: "sb_publishable_SliU4OTdrqAFqoRriuh1Ew_PST1CEdy", kid: "esti-4a7f2c9d" };
    function syncProgress(day, type, rec) {
      if (!CONF.url || !CONF.key || !CONF.kid) return;
      try {
        fetch(`${CONF.url}/rest/v1/progress?on_conflict=kid_id,day,type`, {
          method: "POST",
          headers: { apikey: CONF.key, Authorization: "Bearer " + CONF.key, "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=minimal" },
          body: JSON.stringify({ kid_id: CONF.kid, day, type, attempts: rec.a, correct: rec.c }),
        }).catch(() => {});
      } catch (e) {}
    }
    let _curType = "";
    const Track = {
      key() { return "mg_track_" + PLAYER; },
      load() { try { return JSON.parse(localStorage.getItem(this.key())) || {}; } catch (e) { return {}; } },
      save(d) { try { localStorage.setItem(this.key(), JSON.stringify(d)); } catch (e) {} },
      today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); },
      record(type, correct) {
        if (!type) return;
        const d = this.load(), day = this.today();
        (d[day] = d[day] || {})[type] = d[day][type] || { a: 0, c: 0 };
        d[day][type].a++; if (correct) d[day][type].c++;
        this.save(d);
        syncProgress(day, type, d[day][type]);
      },
    };

    function showMenu() { speechSynthesis && speechSynthesis.cancel(); menu.classList.remove("hidden"); stageWrap.classList.add("hidden"); }
    function showStage() { speechSynthesis && speechSynthesis.cancel(); menu.classList.add("hidden"); stageWrap.classList.remove("hidden"); stage.innerHTML = ""; }
    document.getElementById("back").onclick = () => {
      if (stageWrap.classList.contains("hidden")) location.href = "index.html";
      else showMenu();
    };

    /* ---------- שאלת רב־ברירה אחת (זהה במבנה לעמוד המשולשים) ---------- */
    function askMC({ prompt, shape, options, correctIndex, explain, speakText, icon, next }) {
      stage.innerHTML = "";
      const card = el("div", "qcard " + CARD_TINTS[_cardN++ % CARD_TINTS.length]);
      // איור פינתי הקשור לנושא — רק אם אין כבר איור מרכזי (illus) בשאלה
      if (icon && !/class="illus"/.test(prompt)) card.appendChild(el("div", "mascot", icon));
      card.appendChild(el("div", "prompt-he", prompt));
      if (shape) { const box = el("div"); box.innerHTML = shape; card.appendChild(box.firstChild); }
      stage.appendChild(card);

      const grid = el("div", "opts");
      const fb = el("div", "feedback");
      const actions = el("div", "actions");
      const nextBtn = el("button", "action next hidden", "➡️ הבא");
      nextBtn.onclick = next;
      actions.append(nextBtn);

      const buttons = [];
      let answered = false;
      options.forEach((label, i) => {
        const b = el("button", "opt", label);
        b.onclick = () => {
          if (b.disabled || nextBtn.classList.contains("hidden") === false) return;
          if (!answered) { answered = true; Track.record(_curType, i === correctIndex); }
          if (i === correctIndex) {
            b.classList.add("correct");
            buttons.forEach(x => x.disabled = true);
            soundCorrect(); confetti(70); Score.add();
            fb.className = "feedback great";
            fb.textContent = randItem(["כל הכבוד! 🌟", "מצוין! 🎉", "נכון מאוד! 👏", "יופי! ⭐"]);
            if (explain) { const ex = el("div", "explain"); ex.innerHTML = wrapMath(explain); stage.insertBefore(ex, actions); }
            nextBtn.classList.remove("hidden");
            speakHe(randItem(["כל הכבוד!", "מצוין!", "נכון מאוד!", "יופי!"]));
          } else {
            b.classList.add("wrong"); b.disabled = true; soundTry();
            fb.className = "feedback try"; fb.textContent = "כמעט… עוד פעם 🙂";
          }
        };
        grid.appendChild(b); buttons.push(b);
      });

      stage.append(grid, fb, actions);
      if (speakText) speakHe(speakText);
    }

    /* ---------- עוזרים ---------- */
    function rnd(a, b) { return a + ((Math.random() * (b - a + 1)) | 0); }
    function gcd(x, y) { return y ? gcd(y, x % y) : x; }
    // הנימוק לסימן ההתחלקות של n ב-d (לפי כללי סימני ההתחלקות)
    function divRule(n, d) {
      if (d === 2) return `הוּא זוּגִי (סְפְרַת הָאֲחָדוֹת שֶׁלּוֹ הִיא ${n % 10})`;
      if (d === 5) return `סְפְרַת הָאֲחָדוֹת שֶׁלּוֹ הִיא ${n % 10}`;
      if (d === 10) return `סְפְרַת הָאֲחָדוֹת שֶׁלּוֹ הִיא 0`;
      if (d === 3) { const ds = String(n).split("").map(Number); return `סְכוּם סְפָרוֹתָיו (${ds.join(" + ")} = ${ds.reduce((a, b) => a + b, 0)}) מִתְחַלֵּק בְּ-3`; }
      return `הוּא מִתְחַלֵּק בְּ-${d}`;
    }
    function comma(n) { return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
    function fracHTML(a, b) { return `<span class="frac"><span class="num">${a}</span><span class="den">${b}</span></span>`; }
    // מספר להצגה בתוך טקסט עברי: שלילי נעטף ב-LTR כדי שהמינוס יהיה מצד שמאל
    function sgn(n) { return n < 0 ? `<span dir="ltr">${n}</span>` : `${n}`; }
    // מחשב תוצאת תרגיל (הקלט נוצר על ידי הקוד בלבד — בטוח)
    function evalExpr(s) { return Function("return (" + s.replace(/×/g, "*").replace(/÷/g, "/").replace(/−/g, "-") + ")")(); }
    // עוטף כל ביטוי מתמטי (מספרים + פעולות/שווה) בכיוון LTR, כדי שיֵּרָאֶה נכון בתוך טקסט עברי
    function wrapMath(s) {
      if (!s) return s;
      return s.replace(/[\d(][\d\s.,()×÷+\-−=]*[×÷+\-−=][\d\s.,()×÷+\-−=]*/g,

    // תרגילי שרשרת "מפורסמים" מהחוברת (עמ' 214–216)
    const CHAIN_FIXED = [
      { expr: "5 × (32 − 12)",        value: 100, wrong: [148, 40, 20] },

    // מחוללי תרגילי שרשרת אקראיים
    const CHAIN_GENS = [
      () => { const b = rnd(3,12), c = rnd(3,12), a = rnd(3,9); return { expr:`${a} × (${b} + ${c})`, value:a*(b+c), wrong:[a*b+c, a+b*c, (a+b)*c] }; },
      () => { const a = rnd(3,12), b = rnd(3,12), c = rnd(2,8); return { expr:`(${a} + ${b}) × ${c}`, value:(a+b)*c, wrong:[a+b*c, a*(b+c), a+b+c] }; },
      () => { const a = rnd(3,12), b = rnd(3,9), c = rnd(3,25); return { expr:`${a} × ${b} + ${c}`, value:a*b+c, wrong:[a*(b+c), (a+b)*c, a*b-c] }; },
      () => { const a = rnd(4,12), b = rnd(3,9), c = rnd(2,20); return { expr:`${a} × ${b} − ${c}`, value:a*b-c, wrong:[a*(b-c<0?0:b-c), a*b+c, (a-b)*c] }; },
      () => { const b = rnd(3,9), c = rnd(3,9), a = b*c + rnd(2,40); return { expr:`${a} − ${b} × ${c}`, value:a-b*c, wrong:[(a-b)*c, a-b+c, a-b-c] }; },
      () => { const c = rnd(3,8), a = rnd(8,20), b = rnd(2,a-2); return { expr:`(${a} − ${b}) × ${c}`, value:(a-b)*c, wrong:[a-b*c, a-b+c, a*c-b] }; },

    const FRAC_NAME = { 2:"חֵצִי", 3:"שְׁלִישׁ", 4:"רֶבַע", 5:"חֲמִישִׁית", 6:"שִׁשִּׁית", 8:"שְׁמִינִית", 10:"עֲשִׂירִית" };
    const FRAC_PLURAL = { 2:"חֲצָאִים", 3:"שְׁלִישִׁים", 4:"רְבָעִים", 5:"חֲמִישִׁיּוֹת", 6:"שִׁשִּׁיּוֹת", 8:"שְׁמִינִיּוֹת" };
    const CMP_DENOMS = [2, 3, 4, 5, 6, 8, 10, 12];

    // חקר נתונים — נושאים לדיאגרמת עמודות (עמ' 180–190)
    const CHART_COLORS = ["#ff8fb1", "#84adff", "#7defab", "#ffd77a", "#c08bf0"];
    const CHART_THEMES = [
      { q: "טַעַם הַיּוֹגוּרְט הָאָהוּב", labels: ["תּוּת", "תַּפּוּחַ", "עֲנָבִים", "בָּנָנָה"], noun: "יְלָדִים", verb: "בָּחֲרוּ" },
      { q: "חַיַּת הַמַּחְמָד הָאֲהוּבָה", labels: ["כֶּלֶב", "חָתוּל", "אוֹגֵר", "דָּג"], noun: "יְלָדִים", verb: "בָּחֲרוּ" },
      { q: "הַסְּפּוֹרְט הָאָהוּב", labels: ["כַּדּוּרֶגֶל", "שְׂחִיָּה", "רִיצָה", "אוֹפַנַּיִם"], noun: "תַּלְמִידִים", verb: "בָּחֲרוּ" },
      { q: "הַצֶּבַע הָאָהוּב", labels: ["כָּחֹל", "אָדֹם", "יָרֹק", "צָהֹב"], noun: "יְלָדִים", verb: "בָּחֲרוּ" },
    ];
    // מיון לפי תכונה (חקר נתונים — מיון, עמ' 179)
    const SORT_RULES = [
      { t: "מִתְחַלְּקִים בְּ-5", f: n => n % 5 === 0 },

    /* ---------- בוני סבבים ---------- */
    function roundChain(next) {
      const item = Math.random() < 0.45
        ? bagItem(CHAIN_FIXED)

      const distract = item.wrong.filter(x => x >= 0 && x !== item.value);

      askMC({
        prompt: `<div class="word-q">נֹגַהּ פּוֹתֶרֶת תַּרְגִּילֵי שַׁרְשֶׁרֶת. עִזְרוּ לָהּ לְחַשֵּׁב לְפִי סֵדֶר הַפְּעֻלּוֹת:</div><span class="expr">${item.expr} =</span>`,

    function wordPic(q) {
      if (/פִּיצָה/.test(q)) return "🍕";

      if (/שַׁעֲר|שְׁעָר|כַּדּוּרֶגֶל/.test(q)) return "⚽";
      if (/כַּרְטִיס|מִשְׂחֲק/.test(q)) return "🎟️";

    function roundWord(next) {
      const p = bagItem(WORDPROBS);
      const opts = shuffle([p.correct, ...p.wrong]);
      askMC({
        prompt: `${illus(wordPic(p.q))}<div class="word-q">${p.q}</div><div class="prompt-sub" style="margin-top:12px">אֵיזֶה תַּרְגִּיל שַׁרְשֶׁרֶת מַתְאִים לַבְּעָיָה?</div>`,

        speakText: "קראו את הבעיה, ובחרו את תרגיל השרשרת המתאים.", next,
      });

    function roundWhichFrac(next) {
      const n = randItem([3, 4, 5, 6, 8]);
      const k = rnd(2, n - 1);               // חלקים צבועים (לפחות 2 — כדי שהניסוח יהיה תקין)
      const per = rnd(2, 6);                  // פריטים בכל חלק
      const total = n * per, ans = per * k;
      const c = bagItem(CANDY_CTX);
      const useCircle = Math.random() < 0.5;
      const { nums, correctIndex } = pickOptions(ans, [per, total - ans, ans + per, Math.max(1, ans - per)].filter(x => x > 0));
      askMC({
        prompt: `${illus(c.emoji)}<div class="word-q">${c.whole} מְחֻלֶּקֶת לְ-${n} ${c.part} שָׁווֹת, וְ-${k} מֵהֶן צְבוּעוֹת. עַל כָּל ${c.whole} ${total} ${c.item} בְּפִזּוּר שָׁוֶה. כַּמָּה ${c.item} יֵשׁ עַל הַחֵלֶק הַצָּבוּעַ?</div>`,
        icon: c.emoji,
        shape: useCircle ? fracCircle(n, k) : fracBar(n, k),
        options: nums.map(String), correctIndex,
        explain: `עַל כָּל ${c.one}: ${total} ÷ ${n} = ${per}. עַל ${k} חֲלָקִים צְבוּעִים: ${per} × ${k} = ${ans}.`,
        speakText: "", next,

    // הקשרים מגוונים לחלק מכמות (סכום שני שברים) — כולם בהתאמת מין תקינה
    const PARTQTY_CTX = [
      { e: "🍬", q: (T, fa, fb, nm) => `בַּמְּסִבָּה הָיוּ ${T} סֻכָּרִיּוֹת. ${nm} נָתְנָה ${fa} מֵהֶן לְחָבֵר אֶחָד וְ-${fb} לְחָבֵר אַחֵר. כַּמָּה סֻכָּרִיּוֹת נָתְנָה בְּסַךְ הַכֹּל?` },
      { e: "💰", q: (T, fa, fb, nm) => `לְ${nm} הָיוּ ${T} שְׁקָלִים. הִיא הוֹצִיאָה ${fa} מֵהֶם עַל סֵפֶר וְ-${fb} עַל מִשְׂחָק. כַּמָּה שְׁקָלִים הוֹצִיאָה בְּסַךְ הַכֹּל?` },

      { e: "📖", q: (T, fa, fb, nm) => `בַּסֵּפֶר ${T} עַמּוּדִים. ${nm} קָרְאָה ${fa} מֵהֶם בְּיוֹם רִאשׁוֹן וְ-${fb} בְּיוֹם שֵׁנִי. כַּמָּה עַמּוּדִים קָרְאָה בְּסַךְ הַכֹּל?` },
      { e: "🔵", q: (T, fa, fb, nm) => `לְ${nm} הָיוּ ${T} גֻּלּוֹת. הִיא נָתְנָה ${fa} מֵהֶן לְאָחִיהָ וְ-${fb} לַחֲבֵרָתָהּ. כַּמָּה גֻּלּוֹת נָתְנָה בְּסַךְ הַכֹּל?` },
      { e: "🎈", q: (T, fa, fb) => `בַּחֲגִיגָה תָּלוּ ${T} בַּלּוֹנִים. ${fa} מֵהֶם אֲדֻמִּים וְ-${fb} כְּחֻלִּים. כַּמָּה בַּלּוֹנִים אֲדֻמִּים וּכְחֻלִּים יֵשׁ יַחַד?` },
    ];
    function roundPartQty(next) {
      const pairs = [[2, 3], [2, 4], [3, 4], [2, 6], [4, 6], [3, 6], [2, 5], [4, 5]];
      const [a, b] = randItem(pairs);
      const lcm = a * b / gcd(a, b);
      const total = lcm * rnd(2, 6);
      const ans = total / a + total / b;
      const nm = randItem(["דָּנָה", "מָיָה", "נֹגַהּ", "שִׁירָה", "תָּמָר", "לִיהִי"]);
      const ctx = bagItem(PARTQTY_CTX);
      const { nums, correctIndex } = pickOptions(ans, [total / a, total / b, total - ans, ans + 1].filter(x => x > 0));
      askMC({
        prompt: `${illus(ctx.e)}<div class="word-q">${ctx.q(total, fracHTML(1, a), fracHTML(1, b), nm)}</div>`,
        options: nums.map(String), correctIndex,
        explain: `${FRAC_NAME[a]}: ${total} ÷ ${a} = ${total / a} , ${FRAC_NAME[b]}: ${total} ÷ ${b} = ${total / b} , וּבְיַחַד ${total / a} + ${total / b} = ${ans}.`,
        speakText: "", next,
      });
    }

    function roundCmpFrac(next) {
      const denoms = [2, 3, 4, 5, 6];
      const a = randItem(denoms), b = randItem(denoms);
      const A = a * rnd(2, 8), B = b * rnd(2, 8);   // כמויות שונות — אי אפשר להשוות רק לפי המכנה
      const va = A / a, vb = B / b;
      const opts = [`${fracHTML(1, a)} מִ-${A}`, `${fracHTML(1, b)} מִ-${B}`, "שָׁוִים"];
      const correctIndex = va > vb ? 0 : (vb > va ? 1 : 2);
      askMC({
        prompt: `${illus("🍬")}<div class="word-q">מָה גָּדוֹל יוֹתֵר — ${fracHTML(1, a)} מִתּוֹךְ ${A} סֻכָּרִיּוֹת, אוֹ ${fracHTML(1, b)} מִתּוֹךְ ${B} סֻכָּרִיּוֹת?</div>`,
        options: opts, correctIndex,
        explain: `${FRAC_NAME[a]} מִ-${A}: ${A} ÷ ${a} = ${va} , ${FRAC_NAME[b]} מִ-${B}: ${B} ÷ ${b} = ${vb} . לָכֵן ${va === vb ? "הֵם שָׁוִים" : (va > vb ? `${va} גָּדוֹל יוֹתֵר` : `${vb} גָּדוֹל יוֹתֵר`)}.`,
        speakText: "", next,
      });
    }

    function roundDivis(next) {
      const [d1, d2] = shuffle([2, 3, 5]).slice(0, 2);
      const lcm = d1 * d2;                       // 2,3,5 זרים — מכפלה = מכנה משותף
      const correct = lcm * rnd(2, Math.floor(190 / lcm));
      const pick = cond => { let x, g = 0; do { x = rnd(20, 199); } while (!cond(x) && g++ < 999); return x; };
      const used = new Set([correct]);
      const uniq = cond => { let x, g = 0; do { x = pick(cond); } while (used.has(x) && g++ < 99); used.add(x); return x; };
      const w1 = uniq(x => x % d1 === 0 && x % d2 !== 0);   // רק ב-d1
      const w2 = uniq(x => x % d2 === 0 && x % d1 !== 0);   // רק ב-d2
      const w3 = uniq(x => x % d1 !== 0 && x % d2 !== 0);   // באף אחד
      const opts = shuffle([correct, w1, w2, w3]);
      const ctx = randItem([

    const gemVal = w => [...w].reduce((s, ch) => s + GEM[ch], 0);

    function roundBeforeAfter(next) {

    function roundChart(next) {
      const th = bagItem(CHART_THEMES);

    function roundRiddle(next) {
      const pool = [
        { t: "אֲנִי מִתְחַלֵּק בְּ-5", f: n => n % 5 === 0 },
        { t: "אֲנִי מִתְחַלֵּק בְּ-10", f: n => n % 10 === 0 },
        { t: "אֲנִי מִתְחַלֵּק בְּ-2 (זוּגִי)", f: n => n % 2 === 0 },
        { t: "אֲנִי מִסְפָּר אִי־זוּגִי", f: n => n % 2 === 1 },
        { t: "אֲנִי מִתְחַלֵּק בְּ-3", f: n => n % 3 === 0 },
        { t: "אֲנִי גָּדוֹל מִ-50", f: n => n > 50 },
        { t: "אֲנִי קָטָן מִ-50", f: n => n < 50 },
        { t: "סְפְרַת הָאֲחָדוֹת שֶׁלִּי גְּדוֹלָה מִסְּפְרַת הָעֲשָׂרוֹת", f: n => (n % 10) > Math.floor(n / 10) },
      ];
      let T, clues = [], opts = [];
      for (let attempt = 0; attempt < 300; attempt++) {
        T = rnd(10, 99);
        const sat = pool.filter(c => c.f(T));
        if (sat.length < 3) continue;
        clues = shuffle(sat).slice(0, 3);
        const distr = []; let guard = 0;
        while (distr.length < 3 && guard++ < 800) {
          const x = rnd(10, 99);
          if (x === T || distr.includes(x)) continue;
          if (clues.every(c => c.f(x))) continue;   // אסור שיקיים את כל הרמזים
          if (clues.some(c => c.f(x))) distr.push(x); // "קרוב" — מקיים לפחות רמז אחד
        }
        if (distr.length === 3) { opts = shuffle([T, ...distr]); break; }
      }
      askMC({
        prompt: `${illus("🔍")}<div class="word-q">מִי אֲנִי? אֲנִי מִסְפָּר דּוּ־סִפְרָתִי.<br>${clues.map(c => "• " + c.t).join("<br>")}</div>`,
        options: opts.map(String), correctIndex: opts.indexOf(T),
        explain: `רַק ${T} מְקַיֵּם אֶת כָּל שְׁלוֹשֶׁת הָרְמָזִים.`,
        speakText: "מי אני? בדקו איזה מספר מקיים את כל הרמזים.", next,
      });
    }

    function roundPattern(next) {
      if (Math.random() < 0.5) {
        // ריבועים גדֵלים — מספרים ריבועיים (עמ' 154): צורה k היא k×k
        const m = randItem([5, 6, 7]);

          speakText: "", next,

        return;
      }
      // איבר רחוק בסדרה חשבונית — צריך לגלות את הכלל ולהכליל (לא רק להוסיף פעם אחת)
      const s = rnd(2, 6), d = rnd(2, 5), m = randItem([6, 7, 8, 10]);
      const terms = [s, s + d, s + 2 * d, s + 3 * d];
      const ans = s + (m - 1) * d;

      askMC({
        prompt: `<div class="word-q">גַּלּוּ אֶת הַחֻקִּיּוּת. אִם נַמְשִׁיךְ, מָה יִהְיֶה הָאֵיבָר הַ-${m} בַּסִּדְרָה?</div><span class="expr">${terms.join(" , ")} , ...</span>`,
        icon: "🔢",
        options: nums.map(String), correctIndex,
        explain: `מוֹסִיפִים ${d} בְּכָל פַּעַם. לָכֵן הָאֵיבָר הַ-${m} הוּא ${s} + ${m - 1} × ${d} = ${ans}.`,
        speakText: "", next,
      });
    }

    function roundPlaceValue(next) {
      const set = new Set(); while (set.size < 4) set.add(rnd(1, 9));   // 4 ספרות שונות
      const digits = [...set];
      const largest = +digits.slice().sort((x, y) => y - x).join("");
      const lg = String(largest).split("").map(Number);
      const places = [1000, 100, 10, 1];
      const names = ["אֲלָפִים", "מֵאוֹת", "עֲשָׂרוֹת", "אֲחָדוֹת"];
      const i = rnd(1, 2);                        // שואלים על המאות או העשרות
      const d = lg[i], val = d * places[i];
      const opts = shuffle([d * 1000, d * 100, d * 10, d]);
      askMC({
        prompt: `${illus("🔢")}<div class="word-q">הַרְכִּיבוּ אֶת הַמִּסְפָּר הַגָּדוֹל בְּיוֹתֵר מֵהַסְּפָרוֹת <span class="expr">${digits.join(" , ")}</span>. מָה עֵרֶךְ סְפְרַת ה${names[i]} בַּמִּסְפָּר שֶׁקִּבַּלְתֶּם?</div>`,
        options: opts.map(comma), correctIndex: opts.indexOf(val),
        explain: `הַמִּסְפָּר הַגָּדוֹל בְּיוֹתֵר הוּא ${comma(largest)}. סְפְרַת ה${names[i]} הִיא ${d}, וְעֶרְכָּהּ ${comma(val)}.`,
        speakText: "", next,
      });
    }

    function roundWholes(next) {
      const n = randItem([2, 3, 4, 6]), w = rnd(2, 5);
      const totalParts = w * n;
      const eaten = rnd(2, totalParts - 1);   // לפחות 2 — כדי שהניסוח "אכלו X חלקים" יהיה תקין
      const ans = totalParts - eaten;
      const { nums, correctIndex } = pickOptions(ans, [totalParts, eaten, ans + 1, Math.max(1, ans - 1)].filter(x => x > 0));
      askMC({
        prompt: `${illus("🍰")}<div class="word-q">אִמָּא אָפְתָה ${w} עוּגוֹת וְחִלְּקָה כָּל אַחַת לְ-${n} חֲלָקִים שָׁוִים. הַיְלָדִים אָכְלוּ ${eaten} חֲלָקִים. כַּמָּה חֲלָקִים נִשְׁאֲרוּ?</div>`,
        options: nums.map(String), correctIndex,
        explain: `סַךְ הַחֲלָקִים: ${w} × ${n} = ${totalParts}. נִשְׁאֲרוּ: ${totalParts} − ${eaten} = ${ans}.`,
        speakText: "", next,

    function roundFracName(next) {
      const n = randItem([3, 4, 5, 6, 8]);
      const k = rnd(1, n - 2);                 // כמה כבר צבועים (משאיר לפחות 1 להשלמה)
      const ans = n - k;                        // כמה עוד חסרים לשלם
      const { nums, correctIndex } = pickOptions(ans, [n, ans + 1, ans - 1].filter(v => v > 0));
      askMC({
        prompt: `<div class="word-q">בַּצּוּרָה יֵשׁ חֲלָקִים שָׁוִים, וּ-${k} מֵהֶם צְבוּעִים. כַּמָּה חֲלָקִים עוֹד צְרִיכִים לִצְבֹּעַ כְּדֵי לְהַשְׁלִים שָׁלֵם?</div>`,

    function roundCompareExpr(next) {
      const a = rnd(3, 12), b = rnd(2, 9), c = rnd(2, 9);
      const forms = [
        [`(${a} + ${b}) + ${c}`, `${a} + (${b} + ${c})`],
        [`${a} × ${b}`, `${b} × ${a}`],
        [`(${a} × ${b}) × ${c}`, `${a} × (${b} × ${c})`],
        [`${a} × ${b} − ${c}`, `${a} × (${b} − ${c})`],
        [`(${a} + ${b}) × ${c}`, `${a} + ${b} × ${c}`],
        [`${a} − ${b} + ${c}`, `${a} − (${b} + ${c})`],
        [`${a} × 2 − ${b}`, `${a} − ${b} × 2`],
      ];
      const [L, R] = randItem(forms);
      const eq = evalExpr(L) === evalExpr(R);
      const opts = ["שָׁוִים  ( = )", "לֹא שָׁוִים  ( ≠ )"];
      askMC({
        prompt: `${illus("🤔")}<div class="word-q">רוֹן טוֹעֵן שֶׁשְּׁנֵי הַתַּרְגִּילִים נוֹתְנִים אוֹתָהּ תּוֹצָאָה. הַאִם הוּא צוֹדֵק?</div><span class="expr">${L}</span><br><b>לְעֻמַּת</b><br><span class="expr">${R}</span>`,
        options: opts, correctIndex: eq ? 0 : 1,
        explain: `${L} = ${evalExpr(L)} , ${R} = ${evalExpr(R)} — לָכֵן הֵם ${eq ? "שָׁוִים" : "לֹא שָׁוִים"}.`,
        speakText: "האם שני התרגילים שווים בתוצאה?", next,
      });

    // השלמת המספר החסר כדי שהתרגיל יתאים לתוצאה (חשיבה הפוכה — עמ' 215–216)
    function roundComplete(next) {
      const x = rnd(2, 9);
      const B = `<span class="blank"></span>`;
      const gens = [
        () => { const b = rnd(2, 9), c = rnd(2, 6); return { e: `( ${B} + ${b} ) × ${c}`, T: (x + b) * c }; },
        () => { const a = rnd(2, 9), c = rnd(2, 15); return { e: `${a} × ${B} + ${c}`, T: a * x + c }; },
        () => { const c = rnd(2, 6), b = rnd(2, 12); return { e: `${B} × ${c} + ${b}`, T: x * c + b }; },
        () => { const p = x + rnd(1, 6), c = rnd(2, 6); return { e: `( ${p} − ${B} ) × ${c}`, T: (p - x) * c }; },
        () => { const a = rnd(2, 9), c = rnd(2, Math.max(2, a * x - 1)); return { e: `${a} × ${B} − ${c}`, T: a * x - c }; },
      ];
      const g = randItem(gens)();
      const { nums, correctIndex } = pickOptions(x, [x + 1, x - 1, x + 2].filter(v => v > 0));
      askMC({
        prompt: `<div class="word-q">אֵיזֶה מִסְפָּר צָרִיךְ לְהַשְׁלִים בַּמִּשְׁבֶּצֶת כָּךְ שֶׁהַתַּרְגִּיל יִהְיֶה נָכוֹן?</div><span class="expr">${g.e} = ${g.T}</span>`,
        icon: "🧩",
        options: nums.map(String), correctIndex,
        explain: `הַמִּסְפָּר הַמַּתְאִים הוּא ${x}.`,
        speakText: "איזה מספר צריך להשלים כדי שהתרגיל יהיה נכון?", next,
      });
    }

    // ===== סוגי אתגר (חללית) מהחוברת =====
    // קבוצות שוות בטווח (עמ' 164 — אתגר): התחלקו ל-g קבוצות שוות, בכל קבוצה בין lo ל-hi
    function roundGroups(next) {
      const g = randItem([5, 10]);
      const lo = rnd(11, 16), hi = lo + 3;   // בדיוק שני ערכים אפשריים בכל קבוצה: lo+1, lo+2        // בכל קבוצה: גדול מ-lo וקטן מ-hi
      const per = randItem([lo + 1, lo + 2]);
      const correct = g * per;
      const w1 = g * per + rnd(1, g - 1);                 // לא מתחלק ב-g
      const w2 = g * (hi + rnd(0, 2));                     // מתחלק ב-g אבל בכל קבוצה יותר מדי
      const w3 = g * (lo - rnd(0, 2));                     // מתחלק ב-g אבל בכל קבוצה מעט מדי
      const opts = shuffle([correct, w1, w2, w3]);
      askMC({
        prompt: `${illus("🚌")}<div class="word-q">תַּלְמִידֵי כִּתּוֹת ג' יָצְאוּ לְסִיּוּר וְהִתְחַלְּקוּ לְ-${g} קְבוּצוֹת שָׁווֹת. מִסְפַּר הַתַּלְמִידִים בְּכָל קְבוּצָה גָּדוֹל מִ-${lo} וְקָטָן מִ-${hi}. מָה יָכוֹל לִהְיוֹת מִסְפַּר הַתַּלְמִידִים הַכּוֹלֵל?</div>`,
        options: opts.map(String), correctIndex: opts.indexOf(correct),
        explain: `בְּכָל קְבוּצָה גָּדוֹל מִ-${lo} וְקָטָן מִ-${hi} — כְּלוֹמַר ${lo + 1} אוֹ ${lo + 2} תַּלְמִידִים. לָכֵן הַסַּךְ הַכּוֹלֵל יָכוֹל לִהְיוֹת ${lo + 1} × ${g} = ${(lo + 1) * g} אוֹ ${lo + 2} × ${g} = ${(lo + 2) * g}. רַק ${correct} מוֹפִיעַ בַּתְּשׁוּבוֹת.`,
        speakText: "", next,
      });
    }
    // בנים ובנות — סכום והפרש (עמ' 173 — אתגר)
    function roundBoysGirls(next) {
      const boys = rnd(8, 20), d = rnd(2, 10);
      const girls = boys + d, total = boys + girls;
      const askGirls = Math.random() < 0.5;
      const ans = askGirls ? girls : boys, other = askGirls ? boys : girls;
      const { nums, correctIndex } = pickOptions(ans, [other, Math.round(total / 2), ans + d].filter(x => x > 0));
      askMC({
        prompt: `${illus("🎒")}<div class="word-q">בַּכִּתָּה ${total} תַּלְמִידִים. מִסְפַּר הַבָּנוֹת גָּדוֹל מִמִּסְפַּר הַבָּנִים בְּ-${d}. כַּמָּה ${askGirls ? "בָּנוֹת" : "בָּנִים"} יֵשׁ בַּכִּתָּה?</div>`,
        options: nums.map(String), correctIndex,
        explain: `נִבְדֹּק: אִם יֵשׁ ${boys} בָּנִים, אָז יֵשׁ ${girls} בָּנוֹת (${d} יוֹתֵר), וּבְיַחַד ${boys} + ${girls} = ${total}. זֶה מַתְאִים!`,
        speakText: "", next,
      });
    }
    // מספר בן 4 ספרות לפי כמה רמזים על הספרות (עמ' 160/167 — אתגר)
    function roundClueNumber(next) {
      let T, clues = [], opts = [];
      for (let att = 0; att < 400; att++) {
        T = rnd(1000, 9999);
        const th = Math.floor(T / 1000), h = Math.floor(T / 100) % 10, t = Math.floor(T / 10) % 10, u = T % 10;
        const cand = [];
        cand.push(T > 5000 ? { t: "אֲנִי גָּדוֹל מִ-5,000", f: n => n > 5000 } : { t: "אֲנִי קָטָן מִ-5,000", f: n => n < 5000 });
        if (u === 0) cand.push({ t: "סְפְרַת הָאֲחָדוֹת שֶׁלִּי הִיא 0", f: n => n % 10 === 0 });
        else if (u === 5) cand.push({ t: "סְפְרַת הָאֲחָדוֹת שֶׁלִּי הִיא 5", f: n => n % 10 === 5 });
        else cand.push({ t: "אֲנִי לֹא מִתְחַלֵּק בְּ-5", f: n => n % 5 !== 0 });
        cand.push(th % 2 === 0 ? { t: "סְפְרַת הָאֲלָפִים שֶׁלִּי זוּגִית", f: n => Math.floor(n / 1000) % 2 === 0 } : { t: "סְפְרַת הָאֲלָפִים שֶׁלִּי אִי־זוּגִית", f: n => Math.floor(n / 1000) % 2 === 1 });
        if (h > t) cand.push({ t: "סְפְרַת הַמֵּאוֹת גְּדוֹלָה מִסְּפְרַת הָעֶשְׂרוֹת", f: n => Math.floor(n / 100) % 10 > Math.floor(n / 10) % 10 });
        else if (t > h) cand.push({ t: "סְפְרַת הָעֶשְׂרוֹת גְּדוֹלָה מִסְּפְרַת הַמֵּאוֹת", f: n => Math.floor(n / 10) % 10 > Math.floor(n / 100) % 10 });
        if (cand.length < 3) continue;
        clues = shuffle(cand).slice(0, 3);
        const distr = []; let guard = 0;
        while (distr.length < 3 && guard++ < 1500) {
          const x = rnd(1000, 9999);
          if (x === T || distr.includes(x)) continue;
          if (clues.every(c => c.f(x))) continue;
          if (clues.some(c => c.f(x))) distr.push(x);
        }
        if (distr.length === 3) { opts = shuffle([T, ...distr]); break; }
      }
      askMC({
        prompt: `${illus("🔎")}<div class="word-q">אֵיזֶה מִסְפָּר בֶּן 4 סְפָרוֹת מַתְאִים לְכָל הָרְמָזִים?<br>${clues.map(c => "• " + c.t).join("<br>")}</div>`,
        options: opts.map(comma), correctIndex: opts.indexOf(T),
        explain: `רַק ${comma(T)} מְקַיֵּם אֶת כָּל שְׁלוֹשֶׁת הָרְמָזִים.`,
        speakText: "", next,
      });
    }

    // פילוג בכפל — הַתַּלְמִידָה מַקְלִידָה אֶת הַפִּילּוּג (עמ' דֻּגְמָה בַּחוֹבֶרֶת: 216×4)
    function roundDistrib(next) {
      const m = rnd(3, 8);
      const a = rnd(2, 9), b = rnd(1, 9), c = rnd(1, 9);
      const N = a * 100 + b * 10 + c;
      const parts = [a * 100, b * 10, c];
      const prods = parts.map(p => p * m);
      const total = N * m;

      stage.innerHTML = "";
      const card = el("div", "qcard " + CARD_TINTS[_cardN++ % CARD_TINTS.length]);
      card.appendChild(el("div", "mascot", "✖️"));
      card.appendChild(el("div", "prompt-he", "פִּתְרוּ בְּעֶזְרַת פִּילּוּג — הַקְלִידוּ אֶת הַמִּסְפָּרִים הַחֲסֵרִים:"));

      const inputs = [];
      const txt = s => el("span", "calc-txt", s);
      const mkIn = (exp, w) => {
        const i = el("input", "num-in");
        i.type = "text"; i.inputMode = "numeric"; i.dataset.exp = exp;
        if (w) i.style.width = w;
        inputs.push(i);
        return i;
      };
      const calc = el("div", "calc");
      const l1 = el("div", "calc-row");
      l1.append(txt(`${N} × ${m} =`), mkIn(parts[0]), txt(`× ${m} +`), mkIn(parts[1]), txt(`× ${m} +`), mkIn(parts[2]), txt(`× ${m}`));
      const l2 = el("div", "calc-row");
      l2.append(txt("="), mkIn(prods[0]), txt("+"), mkIn(prods[1]), txt("+"), mkIn(prods[2]));
      const l3 = el("div", "calc-row");
      l3.append(txt("="), mkIn(total, "96px"));
      calc.append(l1, l2, l3);
      card.appendChild(calc);
      stage.appendChild(card);

      const fb = el("div", "feedback");
      const actions = el("div", "actions");
      const checkBtn = el("button", "action listen", "בְּדִיקָה ✓");
      const nextBtn = el("button", "action next hidden", "➡️ הבא");
      nextBtn.onclick = next;
      checkBtn.onclick = () => {
        if (!nextBtn.classList.contains("hidden")) return;
        let allOk = true;
        inputs.forEach(i => {
          const val = i.value.trim().replace(/,/g, "");
          const ok = val !== "" && Number(val) === Number(i.dataset.exp);
          i.classList.toggle("in-ok", ok);
          i.classList.toggle("in-bad", !ok);
          if (!ok) allOk = false;
        });
        if (!checkBtn.dataset.rec) { checkBtn.dataset.rec = "1"; Track.record(_curType, allOk); }
        if (allOk) {
          soundCorrect(); confetti(70); Score.add();
          fb.className = "feedback great";
          fb.textContent = randItem(["כל הכבוד! 🌟", "מצוין! 🎉", "נכון מאוד! 👏"]);
          const ex = el("div", "explain");
          ex.innerHTML = wrapMath(`${N} × ${m} = ${prods[0]} + ${prods[1]} + ${prods[2]} = ${total}.`);
          stage.insertBefore(ex, actions);
          nextBtn.classList.remove("hidden");
        } else {
          soundTry();
          fb.className = "feedback try";
          fb.textContent = "כִּמְעַט… בִּדְקוּ אֶת הַשָּׂדוֹת הָאֲדֻמִּים 🙂";
        }
      };
      actions.append(checkBtn, nextBtn);
      stage.append(fb, actions);
    }

    // כפל מאונך (שיטת דניאלה) — מקלידים את התוצאה

        if (allOk) {
          soundCorrect(); confetti(70); Score.add();
          fb.className = "feedback great"; fb.textContent = randItem(["כל הכבוד! 🌟", "מצוין! 🎉", "נכון מאוד! 👏"]);
          const ex = el("div", "explain"); ex.innerHTML = wrapMath(`${N} × ${m} = ${total}.`);
          stage.insertBefore(ex, actions); nextBtn.classList.remove("hidden");
        } else { soundTry(); fb.className = "feedback try"; fb.textContent = "כִּמְעַט… בִּדְקוּ אֶת הַתָּאִים הָאֲדֻמִּים 🙂"; }
      };
      actions.append(checkBtn, nextBtn);
      stage.append(fb, actions);
    }

    // שלמים וחלקים — הקלדה של סדרת תשובות (קדימה ואחורה), כמו עמ' 22–23
    function roundWholesType(next) {
      const n = randItem([2, 3, 4, 5, 6]);
      const pl = FRAC_PLURAL[n];
      const wA = rnd(2, 4), wB = rnd(5, 8);
      const kA = rnd(2, 4) * n, kB = rnd(5, 7) * n;
      const qs = [
        { t: `כַּמָּה ${pl} יֵשׁ בְּ-${wA} שְׁלֵמִים?`, exp: wA * n, suf: "" },
        { t: `כַּמָּה ${pl} יֵשׁ בְּ-${wB} שְׁלֵמִים?`, exp: wB * n, suf: "" },
        { t: `מִכַּמָּה שְׁלֵמִים נְקַבֵּל ${kA} ${pl}?`, exp: kA / n, suf: "שְׁלֵמִים" },
        { t: `מִכַּמָּה שְׁלֵמִים נְקַבֵּל ${kB} ${pl}?`, exp: kB / n, suf: "שְׁלֵמִים" },
      ];
      stage.innerHTML = "";
      const card = el("div", "qcard " + CARD_TINTS[_cardN++ % CARD_TINTS.length]);
      card.appendChild(el("div", "mascot", "🍰"));
      card.appendChild(el("div", "prompt-he", `זִכְרוּ: בְּשָׁלֵם אֶחָד יֵשׁ ${n} ${pl}. הַשְׁלִימוּ:`));
      const shapeBox = el("div"); shapeBox.innerHTML = fracBar(n, 0); card.appendChild(shapeBox.firstChild);
      const list = el("div", "wq-list");
      const inputs = [];
      qs.forEach(q => {
        const row = el("div", "wq-row");
        row.appendChild(el("span", "", q.t));
        const i = el("input", "num-in");
        i.type = "text"; i.inputMode = "numeric"; i.dataset.exp = q.exp;
        i.style.width = "70px"; i.style.height = "38px";
        inputs.push(i); row.appendChild(i);
        if (q.suf) row.appendChild(el("span", "", q.suf));
        list.appendChild(row);
      });
      card.appendChild(list);
      stage.appendChild(card);
      const fb = el("div", "feedback");
      const actions = el("div", "actions");
      const checkBtn = el("button", "action listen", "בְּדִיקָה ✓");
      const nextBtn = el("button", "action next hidden", "➡️ הבא");
      nextBtn.onclick = next;
      checkBtn.onclick = () => {
        if (!nextBtn.classList.contains("hidden")) return;
        let allOk = true;
        inputs.forEach(i => {
          const v = i.value.trim().replace(/,/g, "");
          const ok = v !== "" && Number(v) === Number(i.dataset.exp);
          i.classList.toggle("in-ok", ok); i.classList.toggle("in-bad", !ok);
          if (!ok) allOk = false;
        });
        if (!checkBtn.dataset.rec) { checkBtn.dataset.rec = "1"; Track.record(_curType, allOk); }
        if (allOk) {
          soundCorrect(); confetti(70); Score.add();
          fb.className = "feedback great"; fb.textContent = randItem(["כל הכבוד! 🌟", "מצוין! 🎉", "נכון מאוד! 👏"]);
          const ex = el("div", "explain");
          ex.textContent = `בְּשָׁלֵם אֶחָד יֵשׁ ${n} ${pl}. כּוֹפְלִים בְּ-${n} כְּדֵי לִמְצֹא כַּמָּה חֲלָקִים, וּמְחַלְּקִים בְּ-${n} כְּדֵי לִמְצֹא כַּמָּה שְׁלֵמִים.`;
          stage.insertBefore(ex, actions); nextBtn.classList.remove("hidden");
        } else { soundTry(); fb.className = "feedback try"; fb.textContent = "כִּמְעַט… בִּדְקוּ אֶת הַשָּׂדוֹת הָאֲדֻמִּים 🙂"; }
      };
      actions.append(checkBtn, nextBtn);
      stage.append(fb, actions);
    }

    // כפל בדרך מפורטת — מקלידים כל מכפלה חלקית (יחידות, עשרות, מאות) ואז את הסכום
    function roundVdetailed(next) {
      const m = rnd(3, 8), a = rnd(2, 9), b = rnd(1, 9), c = rnd(1, 9);
      const N = a * 100 + b * 10 + c, total = N * m;
      stage.innerHTML = "";
      const card = el("div", "qcard " + CARD_TINTS[_cardN++ % CARD_TINTS.length]);
      card.appendChild(el("div", "mascot", "✖️"));
      card.appendChild(el("div", "prompt-he", "כֶּפֶל בְּדֶרֶךְ מְפֹרֶטֶת. מַלְּאוּ אֶת הַמִּסְפָּרִים — כָּל סְפְרָה בַּתָּא שֶׁלָּהּ (אֲחָדוֹת מִתַּחַת לַאֲחָדוֹת):"));
      const P0 = m * c, P1 = m * (b * 10), P2 = m * (a * 100);
      const tStr = String(total), cols = tStr.length, Nstr = String(N);
      const grid = el("div", "vgrid");
      grid.style.gridTemplateColumns = `repeat(${cols}, 44px) auto`;
      const inputs = [];
      const put = (node, col, row) => { node.style.gridColumn = col; node.style.gridRow = row; grid.appendChild(node); };
      const digInput = exp => { const i = el("input", "num-in vg-in"); i.type = "text"; i.inputMode = "numeric"; i.maxLength = 1; i.dataset.exp = exp; inputs.push(i); return i; };
      const placeDigits = (V, row) => { const vs = String(V), len = vs.length; for (let k = 0; k < len; k++) put(digInput(vs[k]), cols - len + 1 + k, row); };
      const placeGiven = (V, row) => { const vs = String(V), len = vs.length; for (let k = 0; k < len; k++) put(el("div", "vg-dig", vs[k]), cols - len + 1 + k, row); };
      const label = (row, operandExp) => {
        const w = el("div", "vg-lbl");
        w.appendChild(el("span", "", `${m} ×`));
        const oi = el("input", "num-in op-in"); oi.type = "text"; oi.inputMode = "numeric"; oi.dataset.exp = operandExp;
        oi.style.width = "58px"; oi.style.height = "34px"; oi.style.fontSize = "18px";
        inputs.push(oi); w.appendChild(oi);
        w.appendChild(el("span", "", "="));
        put(w, cols + 1, row);
      };
      // תאי נשׂא (טיוטה) בראש — לרישום ה-1 שמעבירים בחיבור המאונך
      for (let col = 1; col < cols; col++) { const ci = el("input", "carry-in"); ci.type = "text"; ci.inputMode = "numeric"; ci.maxLength = 1; put(ci, col, 1); }
      placeGiven(N, 2);
      put(el("div", "vg-op", "×"), 1, 3);
      put(el("div", "vg-dig", String(m)), cols, 3);
      const bar1 = el("div", "vg-bar2"); bar1.style.gridColumn = `1 / ${cols + 1}`; bar1.style.gridRow = 4; grid.appendChild(bar1);
      placeDigits(P0, 5); label(5, c);
      placeDigits(P1, 6); label(6, b * 10);
      placeDigits(P2, 7); label(7, a * 100);
      const bar2 = el("div", "vg-bar2"); bar2.style.gridColumn = `1 / ${cols + 1}`; bar2.style.gridRow = 8; grid.appendChild(bar2);
      placeDigits(total, 9);
      card.appendChild(grid);
      stage.appendChild(card);
      const fb = el("div", "feedback");
      const actions = el("div", "actions");
      const checkBtn = el("button", "action listen", "בְּדִיקָה ✓");
      const nextBtn = el("button", "action next hidden", "➡️ הבא");
      nextBtn.onclick = next;
      checkBtn.onclick = () => {
        if (!nextBtn.classList.contains("hidden")) return;
        let allOk = true;
        inputs.forEach(i => {
          const v = i.value.trim().replace(/,/g, "");
          const ok = v !== "" && Number(v) === Number(i.dataset.exp);
          i.classList.toggle("in-ok", ok); i.classList.toggle("in-bad", !ok);
          if (!ok) allOk = false;
        });
        if (!checkBtn.dataset.rec) { checkBtn.dataset.rec = "1"; Track.record(_curType, allOk); }
        if (allOk) {
          soundCorrect(); confetti(70); Score.add();
          fb.className = "feedback great"; fb.textContent = randItem(["כל הכבוד! 🌟", "מצוין! 🎉", "נכון מאוד! 👏"]);
          const ex = el("div", "explain"); ex.innerHTML = wrapMath(`${m}×${c} + ${m}×${b * 10} + ${m}×${a * 100} = ${m * c} + ${m * b * 10} + ${m * a * 100} = ${total}.`);
          stage.insertBefore(ex, actions); nextBtn.classList.remove("hidden");
        } else { soundTry(); fb.className = "feedback try"; fb.textContent = "כִּמְעַט… בִּדְקוּ אֶת הַשָּׂדוֹת הָאֲדֻמִּים 🙂"; }
      };
      actions.append(checkBtn, nextBtn);
      stage.append(fb, actions);
    }

    const ROUNDS = {
      chain: roundChain, word: roundWord, whichFrac: roundWhichFrac, partQty: roundPartQty,
      cmpFrac: roundCmpFrac, divis: roundDivis, gem: roundGem, neg: roundNeg, beforeAfter: roundBeforeAfter,
      chart: roundChart, riddle: roundRiddle, pattern: roundPattern, place: roundPlaceValue, wholes: roundWholes,
      compareExpr: roundCompareExpr, complete: roundComplete,
      groups: roundGroups, boysGirls: roundBoysGirls, clueNumber: roundClueNumber,
      vmult: roundVmult, wholesType: roundWholesType, vdetail: roundVdetailed,
    };

    /* ---------- הפעלה ---------- */
    function play(mode) {
      if (mode === "progress") { showStage(); renderProgress(stage, PLAYER); return; }
      showStage();
      if (mode === "mixed") {
        const go = () => { const k = randItem(Object.keys(ROUNDS)); _curType = k; ROUNDS[k](go); };
        go();
      } else {
        const go = () => { _curType = mode; ROUNDS[mode](go); };
        go();
      }
    }

    if (location.hash === "#progress") play("progress");
  </script>
</body>
