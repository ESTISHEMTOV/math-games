<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>תרגול חשבון בכיף 🧮</title>
  <script>document.write('<link rel="stylesheet" href="style.css?t=' + Date.now() + '">');</script>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <span style="width:90px"></span>
      <div class="score" id="score">⭐ 0</div>
    </div>

    <h1 class="page-title">תרגול חשבון בכיף 🧮</h1>
    <p class="subtitle">בחרי נושא לתרגול 👇</p>

    <div class="games-grid" style="max-width:760px; margin-inline:auto;">
      <button class="subject c-mix" style="max-width:none; margin:0;" onclick="location.href='triangles.html'">
        <span class="ico">📐</span>
        <span class="ttl">משולשים וזוויות</span>
        <span class="sub">סוגי זוויות · סוגי משולשים · נכון או לא</span>
      </button>
      <button class="subject c-blue" style="max-width:none; margin:0;" onclick="location.href='shvilim9.html'">
        <span class="ico">🛤️</span>
        <span class="ttl">שבילים 9</span>
        <span class="sub">סדר פעולות · שברים · גימטריה · מספרים שליליים</span>
      </button>
    </div>

    <div class="games-grid" style="margin-top:26px; max-width:760px; margin-inline:auto;">
      <button class="game-card c-yellow" onclick="location.href='triangles.html#progress'">
        <span class="ico">🏆</span><span class="ttl">ההתקדמות שלי</span><span class="sub">שלבים ואליפויות</span>
      </button>
      <button class="game-card c-teal" onclick="location.href='report.html'">
        <span class="ico">📊</span><span class="ttl">שימוש באפליקציה</span><span class="sub">אחוזים לכל פרק · נכון מתוך סה"כ</span>
      </button>
    </div>
  </div>

  <script>document.write('<script src="engine.js?t=' + Date.now() + '"><\/script>');</script>
  <script>Score.init(document.getElementById("score"), "girl");</script>
</body>
</html>
